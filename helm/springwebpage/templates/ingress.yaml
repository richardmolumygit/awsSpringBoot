{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "springwebpage.fullname" . }}
  labels:
    {{- include "springwebpage.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn is required when ingress is enabled" .Values.ingress.certificateArn | quote }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "ingress.hostname is required when ingress is enabled" .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "springwebpage.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}