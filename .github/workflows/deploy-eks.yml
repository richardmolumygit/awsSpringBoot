name: Build and deploy to EKS

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'push' && 'dev' || inputs.target_environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'dev' || inputs.target_environment }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.target_environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR
        run: ./mvnw -B package

      - name: Validate environment settings
        shell: bash
        run: |
          for variable in AWS_REGION AWS_ROLE_ARN EKS_CLUSTER_NAME ECR_REPOSITORY; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Configure $variable as a variable for the $DEPLOY_ENV GitHub Environment."
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR image URI
        id: image
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "uri=$registry/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        shell: bash
        run: |
          docker buildx build \
            --tag "${{ steps.image.outputs.uri }}:${IMAGE_TAG}" \
            --push \
            .

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy with Helm
        shell: bash
        run: |
          helm upgrade --install springwebpage ./helm/springwebpage \
            --namespace "$DEPLOY_ENV" \
            --create-namespace \
            --values "./helm/springwebpage/values-${DEPLOY_ENV}.yaml" \
            --set-string "image.repository=${{ steps.image.outputs.uri }}" \
            --set-string "image.tag=${IMAGE_TAG}" \
            --atomic \
            --wait \
            --timeout 5m